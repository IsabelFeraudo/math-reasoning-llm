[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "minillm-forge"
version = "0.1.0"
description = "End-to-end LLM fine-tuning and evaluation framework"
requires-python = ">=3.11"
dependencies = [
    # Data
    "datasets>=2.20.0",
    "pydantic>=2.7.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    # ML (CPU versions for local dev in Windows)
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "tokenizers>=0.19.0",

    "pyyaml>=6.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    # Dev
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]